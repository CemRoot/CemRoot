name: Profile assets

# Rebuilds assets/activity-*.svg from live GitHub data once a day, and the
# whole asset set whenever the generator itself changes.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/profile/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/profile/requirements.txt

      - run: pip install -r scripts/profile/requirements.txt

      - name: Fetch activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile/fetch_stats.py --login "${{ github.repository_owner }}"

      - name: Fetch portrait photos (first run only)
        run: python scripts/profile/fetch_photos.py

      - name: Build assets
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/profile/build.py
          else
            python scripts/profile/build.py --only activity
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/profile/data/stats.json scripts/profile/photos
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(profile): refresh activity"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
